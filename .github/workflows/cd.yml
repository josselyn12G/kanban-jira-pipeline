name: CD

# Se ejecuta solo cuando el workflow CI termina con éxito tras un push.
#   - develop -> abre o actualiza el PR de release hacia main (entrega continua).
#   - main    -> Vercel despliega automáticamente (integración con GitHub) y este
#                workflow verifica que producción responda (despliegue continuo).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  PRODUCTION_URL: https://kanban-jira-pipeline.vercel.app

jobs:
  release-pr:
    name: release-pr
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Abrir o actualizar el PR develop → main
        run: |
          ahead=$(gh api "repos/$REPO/compare/main...develop" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "develop no tiene cambios nuevos respecto a main."
            exit 0
          fi
          existing=$(gh pr list --repo "$REPO" --base main --head develop --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Ya existe el PR #$existing (se actualiza con este push)."
            echo "### 📦 Release PR: #$existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          cambios=$(git log --no-merges --format='- %s' origin/main..origin/develop)
          body=$(printf 'Release generado automáticamente por el pipeline tras pasar lint, pruebas y build en `develop`. Al hacer merge, Vercel despliega a producción.\n\n## Cambios\n%s\n' "$cambios")
          url=$(gh pr create --repo "$REPO" --base main --head develop \
            --title "chore(release): versión $version" \
            --body "$body")
          echo "### 📦 Release PR creado: $url" >> "$GITHUB_STEP_SUMMARY"

  verify-production:
    name: verify-production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Esperar el despliegue de Vercel y verificar la versión
        run: |
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 20); do
            html=$(curl -fsS "$PRODUCTION_URL" || true)
            js=$(echo "$html" | grep -o 'assets/index-[^"]*\.js' | head -1)
            if [ -n "$js" ] && curl -fsS "$PRODUCTION_URL/$js" | grep -qF -- "$version"; then
              echo "### 🚀 Producción en línea con la versión $version: $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Intento $i: aún no está la versión $version, reintentando en 15 s..."
            sleep 15
          done
          echo "::error::Producción no respondió con la versión $version"
          exit 1
