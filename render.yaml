# Blueprint de Render: sitio estático desplegado desde main.
# Render → New → Blueprint → seleccionar este repositorio.
services:
  - type: web
    name: kanban-jira-pipeline
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Despliega solo cuando los checks de GitHub (CI) pasan en main
    autoDeployTrigger: checksPass
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
